apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: lightweight-web-app
  title: Lightweight Web App
  description: Creates a dependency-free static web app with a tiny Node.js dev server.
spec:
  owner: user:guest
  type: website

  parameters:
    - title: App details
      required:
        - name
        - description
      properties:
        name:
          title: Name
          type: string
          description: Lowercase repository and component name.
          pattern: '^[a-z0-9]+([-.][a-z0-9]+)*$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Short description shown in the generated app and catalog.
    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          description: Owner is fixed to rgalor-ca; enter a new repository name only.
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - rgalor-ca

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
